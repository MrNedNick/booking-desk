<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="app-page header-inner">
    <a class="brand" routerLink="/schedule">
      <span class="brand-mark" aria-hidden="true">BD</span>
      <span class="brand-text">
        <strong>Booking Desk</strong>
        <span class="app-muted">Meeting rooms, one week at a time</span>
      </span>
    </a>

    <nav class="nav" aria-label="Main">
      <a routerLink="/schedule" routerLinkActive="active">Schedule</a>
      <a routerLink="/bookings" routerLinkActive="active">My bookings</a>
      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">All bookings</a>
      }
    </nav>

    <div class="tools">
      <mat-button-toggle-group
        class="role"
        aria-label="Demo role"
        [value]="role()"
        (change)="setRole($event.value)"
        hideSingleSelectionIndicator
      >
        <mat-button-toggle value="employee">Employee</mat-button-toggle>
        <mat-button-toggle value="admin">Admin</mat-button-toggle>
      </mat-button-toggle-group>

      <button
        matIconButton
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" />
      </button>
    </div>
  </div>
</header>

<main id="main" class="app-page site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="app-page footer-inner">
    <p class="app-muted">
      Signed in as <strong>{{ user().name }}</strong> ·
      {{ isAdmin() ? 'admin' : 'employee' }} · demo data lives in your browser
    </p>
    <nav class="footer-links" aria-label="Project links">
      <a href="https://github.com/MrNedNick/booking-desk" rel="noreferrer noopener" target="_blank">
        Source on GitHub
      </a>
      <a
        href="https://github.com/MrNedNick/booking-desk#readme"
        rel="noreferrer noopener"
        target="_blank"
        >How it is built</a
      >
      <span class="app-muted">© {{ year }}</span>
    </nav>
  </div>
</footer>
